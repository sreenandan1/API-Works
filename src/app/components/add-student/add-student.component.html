<div class="container mt-3 bg-secondary">
    <form [formGroup]="addStudents" (ngSubmit)="saveStudent()">
        <div class="mb-3">
            <label for="exampleInputname1" class="form-label">Name of student</label>
            <input type="text" class="form-control" formControlName="name" id="exampleInputname1" >
          </div>
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Email address</label>
          <input type="email" class="form-control" formControlName="email" id="exampleInputEmail1" >
        </div>
        <div class="mb-3">
          <label for="exampleInputPassword1" class="form-label">Password</label>
          <input type="password" class="form-control" formControlName="password" id="exampleInputPassword1">
        </div>
      
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
</div>
